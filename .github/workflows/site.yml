name: Build and deploy the site

# Builds on every push and pull request, so a branch can be checked before it
# is merged. Deploys to GitHub Pages only from main. Can also be run by hand
# (workflow_dispatch), which on main publishes a new unstrung release without
# a push here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch the latest unstrung release
        run: npm run fetch:unstrung
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/
          cname: eyesunstrung.vip
          force_orphan: true
